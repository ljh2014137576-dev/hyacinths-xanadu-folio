name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect JavaScript workspace
        id: workspace
        shell: bash
        run: |
          if [[ -f package.json && -f package-lock.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Documentation-only bootstrap: JavaScript workspace is not present yet."
          fi

      - name: Set up Node.js
        if: steps.workspace.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.workspace.outputs.ready == 'true'
        run: npm ci

      - name: Lint
        if: steps.workspace.outputs.ready == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.workspace.outputs.ready == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.workspace.outputs.ready == 'true'
        run: npm test

      - name: Build
        if: steps.workspace.outputs.ready == 'true'
        run: npm run build
